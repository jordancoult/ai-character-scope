<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Character Graph</title>
<style>
  :root { --bg:#0f0f12; --panel:#1a1a20; --node:#1f1f27; --line:#34343f; --fg:#ececf0; --muted:#9a9aa6;
          --accent:#ff4d6d; --wire:#7d8cff; --ghost:#55556a; --ok:#3fbf6f; --warn:#f0c03c; --bad:#ff4d4d; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px system-ui, sans-serif; overflow:hidden; }
  #bar { position:fixed; top:0; left:0; right:0; height:52px; display:flex; align-items:center; gap:14px; padding:0 14px;
         background:var(--panel); border-bottom:1px solid var(--line); z-index:10; white-space:nowrap; overflow-x:auto; }
  #bar .fps { font-size:22px; font-weight:700; }
  #bar .t b { font-size:15px; }
  #bar select, #bar input, .node select, .node textarea, .node input[type=text] {
    background:#111116; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 7px; font:13px system-ui; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:6px 11px; font:600 12px system-ui; cursor:pointer; }
  button.sec { background:#33333f; }
  .muted { color:var(--muted); }
  .z0 { color:var(--ok); } .z1 { color:var(--warn); } .z2 { color:var(--bad); }
  #view { position:fixed; top:52px; left:0; right:0; bottom:0; cursor:grab; }
  #view.panning { cursor:grabbing; }
  #world { position:absolute; left:0; top:0; transform-origin:0 0; }
  #wires { position:absolute; left:0; top:0; overflow:visible; pointer-events:none; }
  #wires path { fill:none; stroke-width:3; pointer-events:stroke; cursor:pointer; }
  #wires path.fixed { stroke:var(--wire); opacity:.75; }
  #wires path.on { stroke:var(--wire); }
  #wires path.ghost { stroke:var(--ghost); stroke-dasharray:6 6; opacity:.7; }
  #wires path.ghost:hover { stroke:var(--accent); opacity:1; }
  #wires path.feedback { stroke:#c58bff; stroke-dasharray:3 5; opacity:.8; }
  #wires path.temp { stroke:var(--accent); stroke-dasharray:4 4; pointer-events:none; }
  #wires path.flow { stroke-dasharray:2 14; stroke-width:3; stroke:#fff; opacity:.35; animation:flow 1.2s linear infinite; pointer-events:none; }
  @keyframes flow { to { stroke-dashoffset:-32; } }
  .node { position:absolute; width:210px; background:var(--node); border:1px solid var(--line); border-radius:10px;
          box-shadow:0 6px 18px #0008; }
  .node.disabled { opacity:.45; }
  .node .hd { padding:7px 10px; font-weight:700; border-bottom:1px solid var(--line); cursor:move; border-radius:10px 10px 0 0;
              display:flex; justify-content:space-between; align-items:center; }
  .node .hd small { font-weight:400; color:var(--muted); }
  .node .bd { padding:8px 10px; display:flex; flex-direction:column; gap:6px; }
  .node .bd select, .node .bd textarea, .node .bd input[type=text] { width:100%; }
  .node .ports { display:flex; justify-content:space-between; padding:4px 0 8px; }
  .port { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); margin:3px 0; }
  .port .dot { width:12px; height:12px; border-radius:50%; background:#111116; border:2px solid var(--wire); flex:none; }
  .ins .port { margin-left:-7px; } .outs .port { margin-right:-7px; justify-content:flex-end; }
  .outs .dot { cursor:crosshair; } .ins .dot.hot { background:var(--accent); border-color:var(--accent); }
  .k-src .hd { background:#1d2a24; } .k-cond .hd { background:#2a2440; } .k-mem .hd { background:#2c2230; }
  .k-model .hd { background:#3a1f2a; } .k-out .hd { background:#1f2a3a; } .k-launch .hd { background:#3a3320; }
  .node .bd input[type=range] { width:100%; accent-color:var(--accent); }
  .node.k-launch { width:300px; }
  .lrow { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:12px; }
  .lrow select, .lrow input[type=text] { width:150px !important; }
  .cmd { font:11px ui-monospace, monospace; background:#0b0b0e; border:1px solid var(--line); border-radius:6px; padding:6px; white-space:pre-wrap; word-break:break-all; }
  .badge { font-size:10px; background:#5a4a1c; color:#ffe08a; border-radius:4px; padding:1px 5px; font-weight:600; }
  .pill { position:absolute; transform:translate(-50%,-50%); background:#111116; border:1px solid var(--wire); color:var(--fg);
          border-radius:999px; padding:2px 9px; font:600 12px system-ui; cursor:pointer; user-select:none; white-space:nowrap; z-index:2; }
  .pill.off { border-color:var(--ghost); color:var(--muted); }
  .pill:hover { border-color:var(--accent); }
  #pop { position:fixed; display:none; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; z-index:20;
         width:260px; box-shadow:0 10px 30px #000a; }
  #pop h4 { margin:0 0 6px; font-size:13px; } #pop p { margin:4px 0 8px; color:var(--muted); font-size:12px; line-height:1.4; }
  #pop input[type=range] { width:100%; accent-color:var(--accent); }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#2a2a33; border:1px solid var(--line);
           padding:9px 14px; border-radius:8px; display:none; z-index:30; }
  #help { position:fixed; bottom:12px; left:14px; color:var(--muted); font-size:12px; z-index:5; }
</style>
</head>
<body>
<div id="bar">
  <span class="fps"><span id="fps">-</span> fps</span>
  <span class="t">GPU <b id="gt">-</b></span><span class="t">CPU <b id="ct">-</b></span>
  <select id="preset" title="Preset: sets the defaults that the graph overrides"></select>
  <button id="refresh" class="sec" title="Clear the memory; the sink is rebuilt from what feeds it">Reset memory</button>
  <input id="svn" placeholder="settings name" style="width:150px">
  <button id="save">Save</button><button id="export" class="sec" title="Download everything: all settings, parameters sent to Scope, launch env, git versions, layout">Export everything</button><span id="svm" class="muted"></span>
  <span style="flex:1"></span>
  <button id="helpb" class="sec" title="How to use">?</button>
  <button id="layout" class="sec">Reset layout</button>
  <a href="/classic" style="color:var(--muted)">classic page</a>
</div>
<div id="view"><div id="world"><svg id="wires" width="1" height="1"></svg></div></div>
<div id="pop"></div><div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const post = (url, body) => fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body || {})});
let S = null;              // last /state
let view = {x: 20, y: 10, k: 0.9};
let dragging = false;

// ---------- nodes ----------
const NODES = {
  cam:     {t:'Camera', k:'src', x:20, y:40, outs:['frames'], body:()=>`<span class="muted">Webcam, cropped to 9:16</span>
            ${slider('zoom', 'Zoom', S.zoom, 1, 3, 0.05)}${slider('y_offset', 'Frame up / down', S.y_offset, -1, 1, 0.05)}`},
  start:   {t:'Start image', k:'src', x:20, y:250, outs:['image'], body:()=>`<select data-act="start-pick">${imgOptions(S.start||pick.start)}</select><span class="muted">Shown for ~0.8 s after a reset to seed the sink</span>`},
  ref:     {t:'Reference image', k:'src', x:20, y:420, outs:['image'], body:()=>`<select data-act="ref-pick">${imgOptions((S.ref[0])||pick.ref)}</select><span class="muted">Encoded once per reset (VACE R2V)</span>`},
  prompt:  {t:'Prompt', k:'src', x:20, y:600, outs:['text'], body:()=>`<textarea data-act="prompt" rows="3"></textarea><span class="muted">Enter applies</span>
            <label class="lrow">Blend new prompt over <select data-act="transition" style="width:80px">${[0,2,4,8,16].map(n=>`<option value="${n}" ${S.transition_steps===n?'selected':''}>${n?n+' chunks':'instant'}</option>`).join('')}</select></label>`},
  depth:   {t:'Depth', k:'cond', x:300, y:20, ins:['frames'], outs:['depth'], body:()=> S.depth_available ? `<span class="muted">Video Depth Anything, every chunk</span>` : `<span class="muted">Not available on LongLive</span>`},
  enc:     {t:'VAE encode', k:'cond', x:300, y:190, ins:['frames'], outs:['latent'], body:()=>`<span class="muted">${S.pipeline==='longlive'?'lighttae':'tae'} · 4 frames → 1 latent frame</span>`},
  noise:   {t:'Noise', k:'cond', x:300, y:330, outs:['noise'], body:()=>`<select data-act="noise-mode">${['auto','fixed','random'].map(m=>`<option ${S.noise_mode===m?'selected':''}>${m}</option>`).join('')}</select><span class="muted">Pattern now: ${S.noise_pattern}</span>
            <label><input type="checkbox" data-act="noise-ctl" ${S.noise_controller?'checked':''}> motion-adaptive level</label>`},
  vace:    {t:'VACE', k:'cond', x:580, y:30, ins:['control','reference'], outs:['hints'], body:()=>`<span class="muted">Turns depth/camera and the reference into hints added inside the model</span>`},
  sink:    {t:'Memory: sink', k:'mem', x:580, y:215, ins:['first frames'], outs:['kv'], body:()=>`<span class="muted">First frames after a reset; never evicted</span>
            <label class="lrow">Sink size <select data-act="sink" style="width:110px"><option value="">default (3)</option>${Array.from({length:S.sink_max+1},(_, i)=>`<option ${S.sink_frames===i?'selected':''}>${i}</option>`).join('')}</select></label>
            <span class="muted">latent frames (of ${S.pipeline==='longlive'?12:6} in memory)</span>`},
  current: {t:'Memory: current', k:'mem', x:580, y:420, ins:['latent','noise'], outs:['kv'], body:()=>`<span class="muted">The chunk being generated: noisy camera latent</span>`},
  recent:  {t:'Memory: recent', k:'mem', x:580, y:600, ins:['write'], outs:['kv'], body:()=>`<span class="muted">Rolling window of previous chunks</span>`},
  dit:     {t:'Denoiser (DiT)', k:'model', x:870, y:230, ins:['sink','recent','current','prompt','vace'], outs:['latent','memory'],
            body:()=>`<label class="muted">Steps <select data-act="steps"><option value="">preset (${S.n_steps})</option>${[1,2,3,4,5].map(n=>`<option ${S.steps===n?'selected':''}>${n}</option>`).join('')}</select></label>
                      <span class="muted">Timesteps: ${S.step_list.join(', ')}</span>
                      <label><input type="checkbox" data-act="steer" ${S.attn_on?'checked':''}> attention steering</label>`},
  dec:     {t:'VAE decode', k:'out', x:1150, y:120, ins:['latent'], outs:['frames'], body:()=>`<span class="muted">Latent → 320×576 frames</span>`},
  up:      {t:'Upscaler', k:'out', x:1150, y:270, ins:['frames'], outs:['frames'], body:()=>`<select data-act="upscale"><option value="">preset (${S.upscale})</option>${S.upscalers.map(u=>`<option ${S.upscale_override===u?'selected':''}>${u}</option>`).join('')}</select>
            ${S.upscale==='bicubic-sharp' ? slider('sharpen', 'Sharpen', S.sharpen, 0, 2, 0.05) : ''}`},
  out:     {t:'Output', k:'out', x:1150, y:440, ins:['frames'], body:()=>`<span class="muted">/dev/video10 → OBS / ffplay</span>`},
  launch:  {t:'Launch settings <span class="badge">RESTART</span>', k:'launch', x:1420, y:40, body:()=>launchBody()},
};
const pick = {start:null, ref:null};
const slider = (act, label, v, min, max, step) => `<label class="muted">${label}: <b data-val="${act}">${(+v).toFixed(2)}</b></label>
  <input type="range" data-act="${act}" min="${min}" max="${max}" step="${step}" value="${v}">`;

// ---------- launch settings (need a restart) ----------
let L = null;  // draft
const DEF = {SCOPE_FUSED_KV:'1', SCOPE_COMPILE_BLOCKS:'1', SCOPE_COMPILE_TAE:'1', SCOPE_FP8_ROWWISE:'1', SCOPE_NOISE_T_OFFSET:'0', SCOPE_OUTPUT_TARGET_FRAMES:'3'};
function initLaunch() {
  const e = S.launch.env;
  L = {MODEL: S.launch.model, size: S.launch.size.join(' '), vae: '', seed: S.launch.seed ?? '',
       SCOPE_KV_FRAMES: e.SCOPE_KV_FRAMES || '', SCOPE_FUSED_KV: e.SCOPE_FUSED_KV ?? '1', SCOPE_COMPILE_BLOCKS: e.SCOPE_COMPILE_BLOCKS ?? '1',
       SCOPE_COMPILE_TAE: e.SCOPE_COMPILE_TAE ?? '1', SCOPE_FP8_ROWWISE: e.SCOPE_FP8_ROWWISE ?? '1', SCOPE_NOISE_T_OFFSET: e.SCOPE_NOISE_T_OFFSET ?? '0',
       SCOPE_OUTPUT_TARGET_FRAMES: e.SCOPE_OUTPUT_TARGET_FRAMES ?? '3', CAMERA_SIZE: S.launch.input_size};
}
const sel = (key, opts) => `<select data-launch="${key}">${opts.map(([v, l]) => `<option value="${v}" ${String(L[key])===String(v)?'selected':''}>${l}</option>`).join('')}</select>`;
const chk = (key) => `<input type="checkbox" data-launch="${key}" ${L[key]==='1'?'checked':''}>`;
function launchBody() {
  if (!L) initLaunch();
  const kvDef = S.pipeline === 'longlive' ? 12 : 6;
  return `<div class="lrow">Model ${sel('MODEL', [['streamdiffusionv2','StreamDiffusionV2'],['longlive','LongLive']])}</div>
  <div class="lrow">Generation size ${sel('size', [['512 288','288×512'],['576 320','320×576'],['640 352','352×640']])}</div>
  <div class="lrow">VAE ${sel('vae', [['','model default'],['tae','tae'],['lighttae','lighttae'],['wan','wan (slow)']])}</div>
  <div class="lrow">Seed <input type="text" data-launch="seed" value="${L.seed}" placeholder="default"></div>
  <div class="lrow">Memory size (KV frames) ${sel('SCOPE_KV_FRAMES', [['', 'default ('+kvDef+')'], ...[3,4,5,6,8,10,12].map(n=>[n,n])])}</div>
  <div class="lrow">Fused KV (faster, less realism) ${chk('SCOPE_FUSED_KV')}</div>
  <div class="lrow">Compile blocks ${chk('SCOPE_COMPILE_BLOCKS')}</div>
  <div class="lrow">Compile TAE ${chk('SCOPE_COMPILE_TAE')}</div>
  <div class="lrow">fp8 row-wise ${chk('SCOPE_FP8_ROWWISE')}</div>
  <div class="lrow">Noise-level offset ${sel('SCOPE_NOISE_T_OFFSET', [['0','0 (fixed)'],['100','100 (stock, sparkles)']])}</div>
  <div class="lrow">Output cushion (frames) ${sel('SCOPE_OUTPUT_TARGET_FRAMES', [['0','off'],['3','3'],['6','6'],['12','12']])}</div>
  <div class="lrow">Camera capture ${sel('CAMERA_SIZE', [['640x480','640×480'],['1280x720','1280×720'],['1920x1080','1920×1080']])}</div>
  <span class="muted">Stop the server, then run:</span><div class="cmd" id="cmd">${launchCmd()}</div><button class="sec" data-act="copy-cmd">Copy command</button>`;
}
const shq = v => '"' + String(v).replace(/(["\\$`])/g, '\\$1') + '"';
function launchCmd() {
  const env = [];
  const e = S.launch.env;
  for (const k of ['SCOPE_KV_FRAMES','SCOPE_FUSED_KV','SCOPE_COMPILE_BLOCKS','SCOPE_COMPILE_TAE','SCOPE_FP8_ROWWISE','SCOPE_NOISE_T_OFFSET','SCOPE_OUTPUT_TARGET_FRAMES']) {
    const v = String(L[k] ?? '');
    if (v !== '' && (v !== (DEF[k] ?? '') || k === 'SCOPE_FUSED_KV')) env.push(`${k}=${v}`);
  }
  if (L.MODEL !== 'streamdiffusionv2') env.push(`MODEL=${L.MODEL}`);
  env.push(`PRESET=${S.preset}`, `NOISE_MODE=${S.noise_mode}`);
  if (L.CAMERA_SIZE !== '1280x720') env.push(`CAMERA_SIZE=${L.CAMERA_SIZE}`);
  if (S.ref.length) env.push(`CHARACTER_REF=assets/${S.ref[0]}`);
  env.push(`PROMPT=${shq(S.prompt)}`, 'NO_AUDIO=1');
  const ba = [];
  if (L.size !== '576 320') ba.push('--size ' + L.size);
  if (L.vae) ba.push('--vae ' + L.vae);
  if (String(L.seed).trim() !== '') ba.push('--seed ' + parseInt(L.seed));
  if (ba.length) env.push(`BRIDGE_ARGS=${shq(ba.join(' '))}`);
  return env.join(' ') + ' ./start_scope.sh --bridge';
}
const imgOptions = sel => S.refs.map(f=>`<option ${f===sel?'selected':''}>${f}</option>`).join('');

// ---------- wires ----------
// kind: fixed (always on), toggle (connect/disconnect), feedback. w: weight spec.
const W_ATTN = k => ({key:'attn_'+k, get:()=>S.attn[k], min:0.1, max:3, step:0.05, steer:true});
const EDGES = [
  {id:'cam-enc', a:'cam.frames', b:'enc.frames', kind:'fixed'},
  {id:'cam-depth', a:'cam.frames', b:'depth.frames', kind:'fixed'},
  {id:'enc-cur', a:'enc.latent', b:'current.latent', kind:'fixed'},
  {id:'noise-cur', a:'noise.noise', b:'current.noise', kind:'fixed', w:{key:'noise', label:'noise', get:()=>S.noise, min:0.3, max:0.98, step:0.01,
     title:'Noise level', help:'How much of the camera latent is replaced by noise. Lower = follows you more, higher = more freedom for the model.'}},
  {id:'depth-vace', a:'depth.depth', b:'vace.control', kind:'toggle', on:()=>S.depth_on, set:v=>({depth:v?'on':'off'}),
     help:'Depth map as VACE control: tracks your pose and shape.'},
  {id:'cam-vace', a:'cam.frames', b:'vace.control', kind:'toggle', on:()=>S.vace_input, set:v=>({vace_input:v}),
     help:'Raw camera frames as VACE control (instead of depth). Untested: may copy the camera very literally.'},
  {id:'ref-vace', a:'ref.image', b:'vace.reference', kind:'toggle', on:()=>S.ref.length>0, set:v=>({ref:v?(pick.ref||S.refs[0]):''}),
     help:'Character reference image. Disconnect for prompt only.'},
  {id:'cam-sink', a:'cam.frames', b:'sink.first frames', kind:'toggle', on:()=>!S.start, set:v=>v?{start:''}:null,
     help:'The sink is built from the camera after each reset (default).'},
  {id:'start-sink', a:'start.image', b:'sink.first frames', kind:'toggle', on:()=>!!S.start, set:v=>({start:v?(pick.start||S.refs[0]):''}),
     help:'The sink is built from this image after each reset; then the camera takes over.'},
  {id:'sink-dit', a:'sink.kv', b:'dit.sink', kind:'fixed', w:{...W_ATTN('sink'), label:'sink', title:'Attention to sink', help:'Lower = less anchored to the start, higher = holds the start look harder.'}},
  {id:'recent-dit', a:'recent.kv', b:'dit.recent', kind:'fixed', w:{...W_ATTN('recent'), label:'recent', title:'Attention to recent frames', help:'Lower = less smear / repeated motion, higher = smoother but stickier.'}},
  {id:'cur-dit', a:'current.kv', b:'dit.current', kind:'fixed', w:{...W_ATTN('current'), label:'current', title:'Attention to current chunk', help:'Higher = leans on the live camera latent.'}},
  {id:'prompt-dit', a:'prompt.text', b:'dit.prompt', kind:'fixed', w:{key:'attn_text', label:'prompt', get:()=>S.attn.text, min:0, max:3, step:0.05, steer:true,
     title:'Prompt strength', help:'Scales the cross-attention (prompt) signal in every block. 0 = ignore the prompt.'}},
  {id:'vace-dit', a:'vace.hints', b:'dit.vace', kind:'fixed', w:{key:'vace_scale', label:'vace', get:()=>S.vace_scale, min:0, max:2, step:0.05,
     title:'Conditioning strength', help:'How hard depth/camera control and the reference steer the model.'}},
  {id:'dit-recent', a:'dit.memory', b:'recent.write', kind:'feedback'},
  {id:'dit-dec', a:'dit.latent', b:'dec.latent', kind:'fixed'},
  {id:'dec-up', a:'dec.frames', b:'up.frames', kind:'fixed'},
  {id:'up-out', a:'up.frames', b:'out.frames', kind:'fixed'},
];

// ---------- build DOM ----------
const world = $('world'), wires = $('wires');
function loadLayout() { try { return JSON.parse(localStorage.getItem('graph-layout') || '{}'); } catch (e) { return {}; } }
function saveLayout() { try { localStorage.setItem('graph-layout', JSON.stringify(layout())); } catch (e) {} }
function layout() { const o = {}; for (const id in NODES) o[id] = {x: NODES[id].x, y: NODES[id].y}; return o; }
const saved = loadLayout();
for (const id in saved) if (NODES[id]) Object.assign(NODES[id], saved[id]);

function buildNodes() {
  for (const id in NODES) {
    const n = NODES[id];
    const el = document.createElement('div');
    el.className = 'node k-' + n.k; el.id = 'n-' + id;
    el.innerHTML = `<div class="hd">${n.t}</div><div class="ports"><div class="ins">${(n.ins||[]).map(p=>`<div class="port"><span class="dot" data-port="${id}.${p}"></span>${p}</div>`).join('')}</div>
      <div class="outs">${(n.outs||[]).map(p=>`<div class="port">${p}<span class="dot" data-port="${id}.${p}"></span></div>`).join('')}</div></div><div class="bd"></div>`;
    world.appendChild(el);
    n.el = el;
    place(id);
    el.querySelector('.hd').addEventListener('mousedown', e => startNodeDrag(e, id));
  }
}
function place(id) { const n = NODES[id]; n.el.style.left = n.x + 'px'; n.el.style.top = n.y + 'px'; }

function renderBodies() {
  for (const id in NODES) {
    const n = NODES[id], bd = n.el.querySelector('.bd');
    if (bd.contains(document.activeElement)) continue;  // don't clobber a control being used
    bd.innerHTML = n.body();
    n.el.classList.toggle('disabled', id === 'depth' && !S.depth_available);
  }
  const ta = document.querySelector('[data-act=prompt]');
  if (ta && document.activeElement !== ta) ta.value = S.prompt;
}

// ---------- geometry ----------
function portPos(port) {
  const dot = document.querySelector(`.dot[data-port="${CSS.escape(port)}"]`);
  const r = dot.getBoundingClientRect(), w = world.getBoundingClientRect();
  return {x: (r.left + r.width / 2 - w.left) / view.k, y: (r.top + r.height / 2 - w.top) / view.k};
}
function curve(p, q) {
  const dx = Math.max(60, Math.abs(q.x - p.x) * 0.5);
  return `M${p.x},${p.y} C${p.x + dx},${p.y} ${q.x - dx},${q.y} ${q.x},${q.y}`;
}
function edgeOn(e) { return e.kind !== 'toggle' || e.on(); }
function edgeUsable(e) { return !((e.a.startsWith('depth') || e.b.startsWith('depth')) && !S.depth_available); }

function drawWires() {
  if (!S) return;
  wires.innerHTML = '';
  world.querySelectorAll('.pill').forEach(p => p.remove());
  for (const e of EDGES) {
    if (!edgeUsable(e)) continue;
    const p = portPos(e.a), q = portPos(e.b), d = curve(p, q);
    const on = edgeOn(e);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    path.setAttribute('class', e.kind === 'feedback' ? 'feedback' : e.kind === 'fixed' ? 'fixed' : on ? 'on' : 'ghost');
    path.addEventListener('click', ev => clickEdge(ev, e));
    wires.appendChild(path);
    if (on && e.kind !== 'feedback') {
      const f = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      f.setAttribute('d', d); f.setAttribute('class', 'flow'); wires.appendChild(f);
    }
    if (e.w && on) {
      const m = {x: (p.x + q.x) / 2, y: (p.y + q.y) / 2};
      const pill = document.createElement('div');
      const inactive = e.w.steer && !S.attn_on;
      pill.className = 'pill' + (inactive ? ' off' : '');
      pill.style.left = m.x + 'px'; pill.style.top = m.y + 'px';
      pill.textContent = e.w.label + ' ' + (inactive ? 'off' : e.w.get().toFixed(2));
      pill.title = e.w.title;
      pill.addEventListener('click', ev => { ev.stopPropagation(); clickEdge(ev, e); });
      pill.addEventListener('wheel', ev => { ev.preventDefault(); ev.stopPropagation();
        const v = clamp(e.w.get() + (ev.deltaY < 0 ? 1 : -1) * e.w.step, e.w.min, e.w.max); setWeight(e, v); }, {passive: false});
      world.appendChild(pill);
    }
  }
}
const clamp = (v, a, b) => Math.min(b, Math.max(a, Math.round(v * 100) / 100));

// ---------- edge actions ----------
function setWeight(e, v) {
  if (e.w.key === 'noise') S.noise = v; else if (e.w.key === 'vace_scale') S.vace_scale = v; else S.attn[e.w.key.slice(5)] = v;
  drawWires();
  clearTimeout(e._t); e._t = setTimeout(() => post('/params', {[e.w.key]: v}), 150);
}
function toggle(e, v) {
  const body = e.set(v);
  if (!body) { toast(e.id === 'cam-sink' ? 'The sink needs an input: connect the Start image instead.' : 'Not possible'); return; }
  post('/params', body).then(poll);
}
function clickEdge(ev, e) {
  ev.stopPropagation();
  const on = edgeOn(e);
  if (e.kind === 'toggle' && !on) { toggle(e, true); return; }
  const pop = $('pop');
  let html = `<h4>${e.w ? e.w.title : e.a.split('.')[0] + ' → ' + e.b.split('.')[0]}</h4><p>${(e.w && e.w.help) || e.help || (e.kind === 'feedback' ? 'Each finished chunk is written back into recent memory.' : 'Always connected in this model.')}</p>`;
  if (e.w) {
    html += `<input type="range" id="pw" min="${e.w.min}" max="${e.w.max}" step="${e.w.step}" value="${e.w.get()}"><div class="muted"><span id="pv">${e.w.get().toFixed(2)}</span>${e.w.steer && !S.attn_on ? ' · steering is off (Denoiser node)' : ''}</div>`;
    if (e.w.steer || e.w.key === 'vace_scale') html += `<button class="sec" id="p1" style="margin-top:8px">Set to 1.0</button> `;
  }
  if (e.kind === 'toggle') html += `<button id="pd" style="margin-top:8px">Disconnect</button>`;
  pop.innerHTML = html;
  pop.style.display = 'block';
  pop.style.left = Math.min(ev.clientX + 10, innerWidth - 280) + 'px';
  pop.style.top = Math.min(ev.clientY + 10, innerHeight - 200) + 'px';
  const pw = $('pw');
  if (pw) pw.oninput = () => { $('pv').textContent = (+pw.value).toFixed(2); setWeight(e, +pw.value); };
  if ($('p1')) $('p1').onclick = () => { pw.value = 1; $('pv').textContent = '1.00'; setWeight(e, 1); };
  if ($('pd')) $('pd').onclick = () => { pop.style.display = 'none'; toggle(e, false); };
}
document.addEventListener('mousedown', ev => { if (!$('pop').contains(ev.target) && !ev.target.classList.contains('pill')) $('pop').style.display = 'none'; });
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2600); }

// ---------- dragging: nodes, pan, connect ----------
function startNodeDrag(e, id) {
  e.stopPropagation(); e.preventDefault(); dragging = true;
  const n = NODES[id], sx = e.clientX, sy = e.clientY, ox = n.x, oy = n.y;
  const move = ev => { n.x = ox + (ev.clientX - sx) / view.k; n.y = oy + (ev.clientY - sy) / view.k; place(id); drawWires(); };
  const up = () => { dragging = false; removeEventListener('mousemove', move); removeEventListener('mouseup', up); saveLayout(); };
  addEventListener('mousemove', move); addEventListener('mouseup', up);
}
const viewEl = $('view');
function applyView() { world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`; }
viewEl.addEventListener('mousedown', e => {
  const dot = e.target.closest('.outs .dot');
  if (dot) return startConnect(e, dot.dataset.port);
  if (e.target.closest('.node') || e.target.closest('.pill')) return;
  viewEl.classList.add('panning');
  const sx = e.clientX - view.x, sy = e.clientY - view.y;
  const move = ev => { view.x = ev.clientX - sx; view.y = ev.clientY - sy; applyView(); };
  const up = () => { viewEl.classList.remove('panning'); removeEventListener('mousemove', move); removeEventListener('mouseup', up); };
  addEventListener('mousemove', move); addEventListener('mouseup', up);
});
viewEl.addEventListener('wheel', e => {
  if (e.target.closest('.bd')) return;
  e.preventDefault();
  const k = Math.min(1.6, Math.max(0.4, view.k * (e.deltaY < 0 ? 1.1 : 1 / 1.1)));
  view.x = e.clientX - (e.clientX - view.x) * k / view.k; view.y = (e.clientY - 52) - ((e.clientY - 52) - view.y) * k / view.k; view.k = k;
  applyView(); drawWires();
}, {passive: false});
function startConnect(e, from) {
  e.preventDefault(); e.stopPropagation(); dragging = true;
  const p = portPos(from);
  const temp = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  temp.setAttribute('class', 'temp'); wires.appendChild(temp);
  const move = ev => {
    const w = world.getBoundingClientRect();
    temp.setAttribute('d', curve(p, {x: (ev.clientX - w.left) / view.k, y: (ev.clientY - w.top) / view.k}));
    document.querySelectorAll('.ins .dot').forEach(d => d.classList.toggle('hot', d === ev.target));
  };
  const up = ev => {
    dragging = false; removeEventListener('mousemove', move); removeEventListener('mouseup', up); temp.remove();
    document.querySelectorAll('.ins .dot.hot').forEach(d => d.classList.remove('hot'));
    const dot = ev.target.closest && ev.target.closest('.ins .dot');
    if (!dot) return;
    const e2 = EDGES.find(x => x.a === from && x.b === dot.dataset.port);
    if (!e2 || !edgeUsable(e2)) return toast(`${from.replace('.', ' ')} → ${dot.dataset.port.replace('.', ' ')}: the model has no such input path`);
    if (e2.kind !== 'toggle' || e2.on()) return toast('Already connected');
    toggle(e2, true);
  };
  addEventListener('mousemove', move); addEventListener('mouseup', up);
}

// ---------- node controls ----------
world.addEventListener('change', e => {
  const act = e.target.dataset.act, v = e.target.value;
  if (act === 'start-pick') { pick.start = v; if (S.start) post('/params', {start: v}).then(poll); }
  else if (act === 'ref-pick') { pick.ref = v; if (S.ref.length) post('/params', {ref: v}).then(poll); }
  else if (act === 'noise-mode') post('/params', {noise_mode: v}).then(poll);
  else if (act === 'steps') post('/params', {steps: v}).then(poll);
  else if (act === 'steer') post('/params', {attn_on: e.target.checked}).then(poll);
  else if (act === 'upscale') post('/params', {upscale: v}).then(poll);
  else if (act === 'noise-ctl') post('/params', {noise_controller: e.target.checked}).then(poll);
  else if (act === 'transition') post('/params', {transition_steps: +v}).then(poll);
  else if (act === 'sink') post('/params', {sink_frames: v}).then(() => { poll(); toast('Sink size changed: memory reset'); });
  else if (['zoom', 'y_offset', 'sharpen'].includes(act)) e.target.blur();
  const lk = e.target.dataset.launch;
  if (lk) { L[lk] = e.target.type === 'checkbox' ? (e.target.checked ? '1' : '0') : e.target.value; $('cmd').textContent = launchCmd(); }
});
world.addEventListener('input', e => {
  const act = e.target.dataset.act;
  if (['zoom', 'y_offset', 'sharpen'].includes(act)) {
    const lab = document.querySelector(`[data-val="${act}"]`); if (lab) lab.textContent = (+e.target.value).toFixed(2);
    clearTimeout(e.target._t); e.target._t = setTimeout(() => post('/params', {[act]: +e.target.value}), 120);
  }
  if (e.target.dataset.launch === 'seed') { L.seed = e.target.value; $('cmd').textContent = launchCmd(); }
});
world.addEventListener('click', e => {
  if (e.target.dataset.act === 'copy-cmd') {
    const t = $('cmd').textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Command copied'), () => toast('Select the command and copy it'));
  }
});
world.addEventListener('keydown', e => {
  if (e.target.dataset.act === 'prompt' && e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault(); post('/params', {prompt: e.target.value}).then(poll); e.target.blur(); toast('Prompt applied');
  }
});

// ---------- top bar ----------
const zone = (v, e) => v == null ? '' : v >= e[1] ? 'z2' : v >= e[0] ? 'z1' : 'z0';
function bar() {
  $('fps').textContent = S.fps.toFixed(1);
  const g = $('gt'), c = $('ct');
  g.textContent = S.gpu_temp == null ? '-' : S.gpu_temp + '°C'; g.className = S.gpu_thermal_throttle ? 'z1' : zone(S.gpu_temp, [87, 92]);
  c.textContent = S.cpu_temp == null ? '-' : S.cpu_temp + '°C'; c.className = zone(S.cpu_temp, [100, 110]);
  const ps = $('preset');
  if (!ps.options.length) ps.innerHTML = Object.entries(S.presets).sort((a, b) => b[0] - a[0]).map(([k, l]) => `<option value="${k}">${l}</option>`).join('');
  if (document.activeElement !== ps) ps.value = S.preset;
}
$('preset').onchange = e => post('/preset/' + e.target.value).then(poll);
$('refresh').onclick = () => post('/refresh').then(() => toast('Memory reset'));
$('helpb').onclick = () => {
  const t = $('toast');
  t.innerHTML = 'Drag nodes by their title · drag the background to pan · scroll to zoom<br>Drag from an output dot to an input dot to connect · dashed wires are possible connections (click one to connect)<br>Click a wire or weight to change or disconnect it · scroll over a weight to nudge it · RESTART settings build a launch command';
  t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 9000);
};
$('layout').onclick = () => { try { localStorage.removeItem('graph-layout'); } catch (e) {} location.reload(); };
const saveNow = async () => {
  const r = await (await post('/save', {name: $('svn').value, layout: layout()})).json();
  $('svm').textContent = r.ok ? 'saved ' + r.path.split('/').pop() : 'save failed';
};
$('export').onclick = async () => {
  const data = await (await post('/export', {layout: layout()})).json();
  const name = ($('svn').value.trim().replace(/[^\w -]/g, '_').replace(/ /g, '_') || 'export') + '-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '') + '.json';
  const a = Object.assign(document.createElement('a'), {href: URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'})), download: name});
  document.body.appendChild(a); a.click(); a.remove();
  $('svm').textContent = 'downloaded ' + name;
};
$('save').onclick = saveNow; $('svn').onkeydown = e => { if (e.key === 'Enter') saveNow(); };

// ---------- poll ----------
let built = false;
async function poll() {
  try {
    S = await (await fetch('/state')).json();
    if (!built) { buildNodes(); built = true; }
    bar();
    if (!dragging) { renderBodies(); drawWires(); }
  } catch (e) {}
}
applyView();
poll(); setInterval(poll, 1000);
addEventListener('resize', drawWires);
</script>
</body>
</html>
