<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Character Graph</title>
<style>
  :root { --bg:#0f0f12; --panel:#1a1a20; --node:#1f1f27; --line:#34343f; --fg:#ececf0; --muted:#9a9aa6;
          --accent:#ff4d6d; --wire:#7d8cff; --ghost:#55556a; --ok:#3fbf6f; --warn:#f0c03c; --bad:#ff4d4d; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px system-ui, sans-serif; overflow:hidden; }
  #stats { position:fixed; top:0; left:0; right:0; height:38px; display:flex; align-items:center; gap:18px; padding:0 14px;
           background:#15151b; border-bottom:1px solid var(--line); z-index:11; white-space:nowrap; overflow:hidden; }
  #stats .fps { font-size:20px; font-weight:700; }
  #stats .t b { font-size:15px; }
  #bar { position:fixed; top:38px; left:0; right:0; height:52px; display:flex; align-items:center; gap:14px; padding:0 14px;
         background:var(--panel); border-bottom:1px solid var(--line); z-index:10; white-space:nowrap; overflow-x:auto; }
  #bar .fps { font-size:22px; font-weight:700; }
  #bar .t b { font-size:15px; }
  #bar select, #bar input, .node select, .node textarea, .node input[type=text] {
    background:#111116; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 7px; font:13px system-ui; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:6px 11px; font:600 12px system-ui; cursor:pointer; }
  button.sec { background:#33333f; }
  .muted { color:var(--muted); }
  .z0 { color:var(--ok); } .z1 { color:var(--warn); } .z2 { color:var(--bad); }
  #view { position:fixed; top:90px; left:0; right:0; bottom:0; cursor:grab; }
  #view.panning { cursor:grabbing; }
  #world { position:absolute; left:0; top:0; transform-origin:0 0; }
  #wires { position:absolute; left:0; top:0; overflow:visible; pointer-events:none; }
  #wires path { fill:none; stroke-width:3; pointer-events:stroke; cursor:pointer; }
  #wires path.fixed { stroke:var(--wire); opacity:.75; }
  #wires path.on { stroke:var(--wire); }
  #wires path.ghost { stroke:var(--ghost); stroke-dasharray:6 6; opacity:.7; }
  #wires path.ghost:hover { stroke:var(--accent); opacity:1; }
  #wires path.feedback { stroke:#c58bff; stroke-dasharray:3 5; opacity:.8; }
  #wires path.temp { stroke:var(--accent); stroke-dasharray:4 4; pointer-events:none; }
  #wires path.flow { stroke-dasharray:2 14; stroke-width:3; stroke:#fff; opacity:.35; animation:flow 1.2s linear infinite; pointer-events:none; }
  @keyframes flow { to { stroke-dashoffset:-32; } }
  .node { position:absolute; width:210px; background:var(--node); border:1px solid var(--line); border-radius:10px;
          box-shadow:0 6px 18px #0008; }
  .node.disabled { opacity:.45; }
  .node .hd { padding:7px 10px; font-weight:700; border-bottom:1px solid var(--line); cursor:move; border-radius:10px 10px 0 0;
              display:flex; justify-content:space-between; align-items:center; }
  .node .hd small { font-weight:400; color:var(--muted); }
  .node .bd { padding:8px 10px; display:flex; flex-direction:column; gap:6px; }
  .node .bd select, .node .bd textarea, .node .bd input[type=text] { width:100%; }
  .node .ports { display:flex; justify-content:space-between; padding:4px 0 8px; }
  .port { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); margin:3px 0; }
  .port .dot { width:12px; height:12px; border-radius:50%; background:#111116; border:2px solid var(--wire); flex:none; }
  .ins .port { margin-left:-7px; } .outs .port { margin-right:-7px; justify-content:flex-end; }
  .outs .dot { cursor:crosshair; } .outs .dot:hover { box-shadow:0 0 0 4px #7d8cff55; }
  .ins .dot.compat { background:var(--ok); border-color:var(--ok); box-shadow:0 0 0 5px #3fbf6f44; animation:pulse 1s ease-in-out infinite; }
  .ins .dot.compat.hot { background:#fff; border-color:#fff; box-shadow:0 0 0 7px #3fbf6f88; }
  .ins .dot.connected { box-shadow:0 0 0 5px #7d8cff44; }
  body.connecting .ins .dot:not(.compat) { opacity:.35; }
  @keyframes pulse { 50% { box-shadow:0 0 0 8px #3fbf6f22; } }
  .k-src .hd { background:#1d2a24; } .k-cond .hd { background:#2a2440; } .k-mem .hd { background:#2c2230; }
  .campv { display:block; max-width:100%; max-height:150px; margin:6px auto 0; border-radius:4px; background:#000; min-height:40px; }
  .k-model .hd { background:#3a1f2a; } .k-out .hd { background:#1f2a3a; } .k-launch .hd { background:#3a3320; }
  .node .bd input[type=range] { width:100%; accent-color:var(--accent); }
  .node.k-launch { width:300px; }
  .lrow { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:12px; }
  .lrow select, .lrow input[type=text] { width:150px !important; }
  .cmd { font:11px ui-monospace, monospace; background:#0b0b0e; border:1px solid var(--line); border-radius:6px; padding:6px; white-space:pre-wrap; word-break:break-all; }
  .ap { font-size:11px; margin-left:4px; cursor:help; } .ar { color:#c58bff; } .ai { color:#f0c03c; }
  .badge { font-size:10px; background:#5a4a1c; color:#ffe08a; border-radius:4px; padding:1px 5px; font-weight:600; }
  .pill { position:absolute; transform:translate(-50%,-50%); background:#111116; border:1px solid var(--wire); color:var(--fg);
          border-radius:999px; padding:2px 9px; font:600 12px system-ui; cursor:pointer; user-select:none; white-space:nowrap; z-index:2; }
  .pill.off { border-color:var(--ghost); color:var(--muted); }
  .pill:hover { border-color:var(--accent); }
  #pop { position:fixed; display:none; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; z-index:20;
         width:260px; box-shadow:0 10px 30px #000a; }
  #pop h4 { margin:0 0 6px; font-size:13px; } #pop p { margin:4px 0 8px; color:var(--muted); font-size:12px; line-height:1.4; }
  #pop input[type=range] { width:100%; accent-color:var(--accent); }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#2a2a33; border:1px solid var(--line);
           padding:9px 14px; border-radius:8px; display:none; z-index:30; }
  #toast.ok { border-color:var(--ok); } #toast.reset { border-color:#c58bff; } #toast.err { border-color:var(--bad); }
  #overlay { position:fixed; inset:0; background:#000c; display:none; z-index:40; align-items:center; justify-content:center; font-size:18px; flex-direction:column; gap:10px; }
  #help { position:fixed; bottom:12px; left:14px; color:var(--muted); font-size:12px; z-index:5; }
</style>
</head>
<body>
<div id="stats">
  <span class="fps"><span id="fps">-</span> fps</span>
  <span class="t">GPU <b id="gt">-</b></span><span class="t">CPU <b id="ct">-</b></span>
  <span class="muted" id="runinfo"></span>
</div>
<div id="bar">
  <select id="preset" title="Preset: sets the defaults that the graph overrides"></select>
  <button id="resetp" class="sec" title="Clear every graph override (prompt and reference image are kept)">Reset to preset</button>
  <button id="refresh" class="sec" title="Clear the memory; the sink is rebuilt from what feeds it">Reset memory</button>
  <input id="svn" placeholder="settings name" style="width:150px">
  <button id="save">Save</button><button id="loadb" class="sec" title="Load a saved settings file or an export (live settings apply now; launch settings go to the Launch node)">Load…</button><input type="file" id="loadf" accept=".json,application/json" hidden><button id="export" class="sec" title="Download everything: all settings, parameters sent to Scope, launch env, git versions, layout">Export everything</button><span id="svm" class="muted"></span>
  <span style="flex:1"></span>
  <span class="muted" title="How changes apply"><span class="ai">⚡</span> instant &nbsp;<span class="ar">↻</span> resets memory &nbsp;<span class="badge">RESTART</span> needs restart</span>
  <button id="helpb" class="sec" title="How to use">?</button>
  <button id="layout" class="sec">Reset layout</button>
  <a href="/classic" style="color:var(--muted)">classic page</a>
</div>
<div id="view"><div id="world"><svg id="wires" width="1" height="1"></svg></div></div>
<div id="pop"></div><div id="toast"></div>
<div id="overlay"><div id="ovt">Restarting…</div><div class="muted">Watch the start_scope.sh terminal for progress.</div></div>

<script>
const $ = id => document.getElementById(id);
const post = (url, body) => fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body || {})});
let S = null;              // last /state
// How each change applies: instantly (memory kept) or with an automatic memory reset
const RESET_KEYS = ['depth', 'vace_input', 'ref', 'start', 'sink_frames', 'steps', 'ref_camera'];
const resets = body => Object.keys(body).some(k => RESET_KEYS.includes(k)) || ('prompt' in body && !S.transition_steps);
const NAMES = {noise:'Noise level', attn_sink:'Attention to sink', attn_recent:'Attention to recent', attn_current:'Attention to current',
  attn_text:'Prompt strength', vace_scale:'Conditioning strength', zoom:'Zoom', y_offset:'Framing', sharpen:'Sharpen', upscale:'Upscaler',
  noise_mode:'Noise pattern', noise_controller:'Motion-adaptive noise', transition_steps:'Prompt blending', attn_on:'Attention steering',
  steps:'Diffusion steps', sink_frames:'Sink size', depth:'Depth input', vace_input:'Camera → VACE', ref:'Reference image', start:'Start image', prompt:'Prompt', ref_camera:'Camera snapshot as reference', ref_source:'', start_source:''};
function setP(body) {
  const r = resets(body), what = Object.keys(body).map(k => NAMES[k] ?? k).filter(Boolean).join(', ');
  return post('/params', body).then(res => {
    if (!res.ok) throw new Error(res.status);
    if ('vace_input' in body) toast('⟳ Camera → VACE control is wired when the stream starts: click Restart (Launch node) to apply. On: the camera only steers (image starts from pure noise); off: the camera is the starting image.', 'reset');
    else toast(r ? `↻ ${what}: applied, memory reset (character rebuilds over ~1 s)` : `⚡ ${what}: applied instantly`, r ? 'reset' : 'ok');
    poll();
  }).catch(() => toast(`✗ ${what}: not applied (is the bridge running?)`, 'err'));
}
const TAG_I = '<span class="ap ai" title="Applies instantly, memory kept">⚡</span>';
const TAG_R = '<span class="ap ar" title="Applies right away with an automatic memory reset">↻</span>';
let view = {x: 20, y: 10, k: 0.9};
let dragging = false;

// ---------- nodes ----------
const NODES = {
  cam:     {t:'Camera', k:'src', x:20, y:40, outs:['frames'], body:()=>`<span class="muted">Preview: exactly what the model receives</span>
            ${slider('zoom', 'Zoom', S.zoom, 1, 3, 0.05)}${slider('y_offset', 'Frame up / down', S.y_offset, -1, 1, 0.05)}
            <span class="muted"><b>Place in scene</b>: shrink yourself into the generated world (1 = off)</span>
            ${slider('place_scale', 'Size', S.place_scale ?? 1, 0.2, 1, 0.05)}${slider('place_x', 'Left / right', S.place_x ?? 0.5, 0, 1, 0.05)}${slider('place_y', 'Up / down', S.place_y ?? 0.6, 0, 1, 0.05)}`},
  start:   {t:'Start image', k:'src', x:20, y:400, outs:['image'], body:()=>`<span class="muted">Image${TAG_R}</span><select data-act="start-pick">${imgOptions((S.start_source==='start'&&S.start)||(S.ref_source==='start'&&S.ref[0])||pick.start)}</select><span class="muted">Shown for ~0.8 s after a reset to seed the sink</span>`},
  ref:     {t:'Reference image', k:'src', x:20, y:600, outs:['image'], body:()=>`<span class="muted">Image${TAG_R}</span><select data-act="ref-pick">${imgOptions((S.ref_source==='ref'&&S.ref[0])||(S.start_source==='ref'&&S.start)||pick.ref)}</select><span class="muted">Encoded once per reset (VACE R2V)</span>`},
  prompt:  {t:'Prompt', k:'src', x:20, y:800, outs:['text'], body:()=>`<textarea data-act="prompt" rows="3"></textarea><span class="muted">Enter applies · ${S.transition_steps ? TAG_I + ' blends in, memory kept' : TAG_R + ' instant change resets memory'}</span>
            <label class="lrow">Blend new prompt over <select data-act="transition" style="width:80px">${[0,2,4,8,16].map(n=>`<option value="${n}" ${S.transition_steps===n?'selected':''}>${n?n+' chunks':'instant'}</option>`).join('')}</select></label>`},
  depth:   {t:'Depth', k:'cond', x:300, y:20, ins:['frames'], outs:['depth'], body:()=> S.depth_available ? `<label class="lrow">Compute depth <select data-act="depth-stride">${[[1,'every frame'],[2,'every 2 frames'],[4,'every 4 frames (default)'],[12,'once per chunk (old, jerky)']].map(([v,l])=>`<option value="${v}" ${(S.depth_stride||4)==v?'selected':''}>${l}</option>`).join('')}</select></label>${slider('depth_cutoff', 'Body only (drop background)', S.depth_cutoff || 0, 0, 0.9, 0.05)}<span class="muted">0 = full scene depth. ~0.5 keeps just you; the model invents the rest</span><label class="lrow">Cut out person (no box edges)${TAG_I} <input type="checkbox" data-act="person-seg" ${S.person_seg?'checked':''}></label>${slider('depth_keep', 'Auto body-only: keep nearest fraction (0 = use cutoff)', S.depth_keep || 0, 0, 0.9, 0.05)}${slider('person_hint', 'Identity hint (your colours inside your outline)', S.person_hint || 0, 0, 0.9, 0.02)}` : `<span class="muted">Not available</span>`},
  enc:     {t:'VAE encode', k:'cond', x:300, y:190, ins:['frames'], outs:['latent'], body:()=>`<span class="muted">${S.pipeline!=='streamdiffusionv2'?'lighttae':'tae'} · 4 frames → 1 latent frame</span>`},
  noise:   {t:'Noise', k:'cond', x:300, y:330, outs:['noise'], body:()=>`<span class="muted">Pattern${TAG_I}</span><select data-act="noise-mode">${['auto','fixed','random'].map(m=>`<option ${S.noise_mode===m?'selected':''}>${m}</option>`).join('')}</select><span class="muted">Pattern now: ${S.noise_pattern}</span>
            <label><input type="checkbox" data-act="noise-ctl" ${S.noise_controller?'checked':''}> motion-adaptive level${TAG_I}</label>
            ${slider('feedback', 'Feedback: start from the last output (0 = off)', S.feedback || 0, 0, 1, 0.05)}<span class="muted">Each chunk refines the previous result instead of restarting from the camera. Feedback 1 = no camera at all. Noise = how much is reinvented each chunk (variety vs. polish)</span>
            ${(S.feedback_mode||'last')==='extrapolate' ? slider('feedback_motion', 'Motion carried forward (1 = all)', S.feedback_motion ?? 1, 0, 1.5, 0.05) : ''}<label class="lrow">Feedback source <select data-act="feedback-mode">${[['last','newest frame (steady)'],['extrapolate','continue motion'],['chunk','whole chunk']].map(([v,l])=>`<option value="${v}" ${(S.feedback_mode||'last')===v?'selected':''}>${l}</option>`).join('')}</select></label>`},
  vace:    {t:'VACE', k:'cond', x:580, y:30, ins:['control','reference'], outs:['hints'], body:()=>`<span class="muted">Turns depth/camera and the reference into hints added inside the model</span>`},
  sink:    {t:'Memory: sink', k:'mem', x:580, y:215, ins:['first frames'], outs:['kv'], body:()=>`<span class="muted">First frames after a reset; never evicted</span>
            <label class="lrow">Sink size${TAG_R} <select data-act="sink" style="width:110px"><option value="">default (3)</option>${Array.from({length:S.sink_max+1},(_, i)=>`<option ${S.sink_frames===i?'selected':''}>${i}</option>`).join('')}</select></label>
            <span class="muted">latent frames (of ${({longlive:12, memflow:12, 'reward-forcing':9})[S.pipeline] || 6} in memory)</span>
            ${S.pipeline==='longlive' ? `<label class="lrow">Keyframe memory${TAG_I} <select data-act="sink_refresh" style="width:110px">${[[0,'off'],[4,'every 4 s'],[7,'every 7 s'],[10,'every 10 s'],[15,'every 15 s']].map(([v,l])=>`<option value="${v}" ${(+S.sink_refresh_s||0)===v?'selected':''}>${l}</option>`).join('')}</select></label><span class="muted">Copies a fresh frame into one sink slot at a time, so memory spans ~slots × interval seconds</span>` : ''}`},
  current: {t:'Memory: current', k:'mem', x:580, y:420, ins:['latent','noise'], outs:['kv'], body:()=>`<span class="muted">The chunk being generated: noisy camera latent</span>`},
  recent:  {t:'Memory: recent', k:'mem', x:580, y:600, ins:['write'], outs:['kv'], body:()=>`<span class="muted">Rolling window of previous chunks</span>`},
  dit:     {t:'Denoiser (DiT)', k:'model', x:870, y:230, ins:['sink','recent','current','prompt','vace'], outs:['latent','memory'],
            body:()=>`<label class="muted">Steps${TAG_R} <select data-act="steps"><option value="">preset (${S.n_steps})</option>${[1,2,3,4,5].map(n=>`<option ${S.steps===n?'selected':''}>${n}</option>`).join('')}</select></label>
                      <span class="muted">Timesteps: ${S.step_list.join(', ')}</span>
                      <label><input type="checkbox" data-act="steer" ${S.attn_on?'checked':''}> attention steering${TAG_I}</label>
                      <label title="With 2+ steps, skip the extra pass that re-reads the finished frames into memory; the last step's memory is used instead (one pass fewer per chunk)"><input type="checkbox" data-act="skip-clean" ${S.skip_clean_kv?'checked':''}> fast memory (2+ steps)${TAG_I}</label>`},
  dec:     {t:'VAE decode', k:'out', x:1150, y:120, ins:['latent'], outs:['frames'], body:()=>`<span class="muted">Latent → 320×576 frames</span>`},
  up:      {t:'Upscaler', k:'out', x:1150, y:270, ins:['frames'], outs:['frames'], body:()=>`<span class="muted">Method${TAG_I}</span><select data-act="upscale"><option value="">preset (${S.upscale})</option>${S.upscalers.map(u=>`<option ${S.upscale_override===u?'selected':''}>${u}</option>`).join('')}</select>
            ${S.upscale==='bicubic-sharp' ? slider('sharpen', 'Sharpen', S.sharpen, 0, 2, 0.05) : ''}`},
  out:     {t:'Output', k:'out', x:1150, y:500, ins:['frames'], body:()=>`<span class="muted">/dev/video10 → OBS / ffplay</span>`},
  launch:  {t:'Launch settings <span class="badge">RESTART</span>', k:'launch', x:1420, y:40, body:()=>launchBody()},
};
const pick = {start:null, ref:null};
const slider = (act, label, v, min, max, step) => `<label class="muted">${label}${TAG_I}: <b data-val="${act}">${(+v).toFixed(2)}</b></label>
  <input type="range" data-act="${act}" min="${min}" max="${max}" step="${step}" value="${v}">`;

// ---------- launch settings (need a restart) ----------
let L = null;  // draft
const DEF = {SCOPE_FUSED_KV:'1', SCOPE_COMPILE_BLOCKS:'1', SCOPE_COMPILE_TAE:'1', SCOPE_FP8_ROWWISE:'1', SCOPE_NOISE_T_OFFSET:'0', SCOPE_OUTPUT_TARGET_FRAMES:'3'};
function initLaunch() {
  const e = S.launch.env;
  L = {MODEL: S.launch.model, size: [...S.launch.size].sort((a,b)=>b-a).join(' '), ORIENTATION: e.ORIENTATION || 'portrait', INPUT_IMAGE: e.INPUT_IMAGE || '', vae: '', seed: S.launch.seed ?? '',
       SCOPE_KV_FRAMES: e.SCOPE_KV_FRAMES || '', SCOPE_FUSED_KV: e.SCOPE_FUSED_KV ?? '1', SCOPE_COMPILE_BLOCKS: e.SCOPE_COMPILE_BLOCKS ?? '1',
       SCOPE_COMPILE_TAE: e.SCOPE_COMPILE_TAE ?? '1', SCOPE_FP8_ROWWISE: e.SCOPE_FP8_ROWWISE ?? '1', SCOPE_NOISE_T_OFFSET: e.SCOPE_NOISE_T_OFFSET ?? '0',
       SCOPE_OUTPUT_TARGET_FRAMES: e.SCOPE_OUTPUT_TARGET_FRAMES ?? '3', CAMERA_SIZE: S.launch.input_size};
}
const sel = (key, opts) => `<select data-launch="${key}">${opts.map(([v, l]) => `<option value="${v}" ${String(L[key])===String(v)?'selected':''}>${l}</option>`).join('')}</select>`;
const chk = (key) => `<input type="checkbox" data-launch="${key}" ${L[key]==='1'?'checked':''}>`;
function launchBody() {
  if (!L) initLaunch();
  const kvDef = ({longlive:12, memflow:12, 'reward-forcing':9})[S.pipeline] || 6;
  return `<div class="lrow">Model ${sel('MODEL', [['streamdiffusionv2','StreamDiffusionV2'],['longlive','LongLive'],['reward-forcing','Reward Forcing (new)'],['memflow','MemFlow (new)']])}</div>
  <div class="lrow">Orientation ${sel('ORIENTATION', [['portrait','Portrait 9:16'],['landscape','Landscape 16:9']])}</div>
  <div class="lrow">Input ${sel('INPUT_IMAGE', [['','Camera'], ...(S.refs||[]).map(f=>['assets/'+f, 'Animate image: '+f])])}</div>
  <div class="lrow">Generation size ${sel('size', [['512 288','288×512'],['576 320','320×576'],['640 352','352×640']])}</div>
  <div class="lrow">VAE ${sel('vae', [['','model default'],['tae','tae'],['lighttae','lighttae'],['wan','wan (slow)']])}</div>
  <div class="lrow">Seed <input type="text" data-launch="seed" value="${L.seed}" placeholder="default"></div>
  <div class="lrow">Memory size (KV frames) ${sel('SCOPE_KV_FRAMES', [['', 'default ('+kvDef+')'], ...[3,4,5,6,8,10,12].map(n=>[n,n])])}</div>
  <div class="lrow">Fused KV (faster, less realism) ${chk('SCOPE_FUSED_KV')}</div>
  <div class="lrow">Compile blocks ${chk('SCOPE_COMPILE_BLOCKS')}</div>
  <div class="lrow">Compile TAE ${chk('SCOPE_COMPILE_TAE')}</div>
  <div class="lrow">fp8 row-wise ${chk('SCOPE_FP8_ROWWISE')}</div>
  <div class="lrow">Noise-level offset ${sel('SCOPE_NOISE_T_OFFSET', [['0','0 (fixed)'],['100','100 (stock, sparkles)']])}</div>
  <div class="lrow">Output cushion (frames) ${sel('SCOPE_OUTPUT_TARGET_FRAMES', [['0','off'],['3','3'],['6','6'],['12','12']])}</div>
  <div class="lrow">Camera capture ${sel('CAMERA_SIZE', [['640x480','640×480'],['1280x720','1280×720'],['1920x1080','1920×1080']])}</div>
  <span class="muted">Stop the server, then run:</span><div class="cmd" id="cmd">${launchCmd()}</div><button data-act="restart">Restart with these settings</button><button class="sec" data-act="copy-cmd">Copy command</button>
  <span class="muted">Restarts in the same terminal (~40 s). Your live graph settings are kept.</span>`;
}
const shq = v => '"' + String(v).replace(/(["\\$`])/g, '\\$1') + '"';
function launchCmd() {
  const env = [];
  const e = S.launch.env;
  for (const k of ['SCOPE_KV_FRAMES','SCOPE_FUSED_KV','SCOPE_COMPILE_BLOCKS','SCOPE_COMPILE_TAE','SCOPE_FP8_ROWWISE','SCOPE_NOISE_T_OFFSET','SCOPE_OUTPUT_TARGET_FRAMES']) {
    const v = String(L[k] ?? '');
    if (v !== '' && (v !== (DEF[k] ?? '') || k === 'SCOPE_FUSED_KV')) env.push(`${k}=${v}`);

  c.textContent = S.cpu_temp == null ? '-' : S.cpu_temp + '°C'; c.className = zone(S.cpu_temp, [100, 110]);
  const ln = S.launch || {};
  $('runinfo').textContent = [ln.model, ln.size ? [...ln.size].sort((a, b) => b - a).join('×') : ''].filter(Boolean).join(' · ');
  const ps = $('preset');
  if (!ps.options.length) ps.innerHTML = Object.entries(S.presets).sort((a, b) => b[0] - a[0]).map(([k, l]) => `<option value="${k}">${l}</option>`).join('');
  if (document.activeElement !== ps) ps.value = S.preset;
}
$('preset').onchange = e => post('/preset/' + e.target.value).then(() => { poll(); toast('↻ Preset applied, memory reset (your graph overrides stay; use Reset to preset to clear them)', 'reset'); });
$('resetp').onclick = () => { if (!confirm('Reset every setting in the graph to the preset? (Prompt and reference image are kept.)')) return;
  post('/reset_overrides').then(r => { if (!r.ok) throw 0; poll(); toast('↻ All settings reset to the preset, memory reset', 'reset'); }).catch(() => toast('✗ Not applied: restart start_scope.sh once to load the new bridge', 'err')); };
$('refresh').onclick = () => post('/refresh').then(() => toast('↻ Memory reset', 'reset'));
$('helpb').onclick = () => {
  const t = $('toast');
  t.innerHTML = 'Drag nodes by their title · drag the background to pan · scroll to zoom<br>Drag from an output dot to an input dot to connect · dashed wires are possible connections (click one to connect)<br>Click a wire or weight to change or disconnect it · scroll over a weight to nudge it · RESTART settings build a launch command';
  t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 9000);
};
$('layout').onclick = () => { try { localStorage.removeItem('graph-layout'); } catch (e) {} location.reload(); };
const saveNow = async () => {
  const r = await (await post('/save', {name: $('svn').value, layout: layout()})).json();
  $('svm').textContent = r.ok ? 'saved ' + r.path.split('/').pop() : 'save failed';
};
$('export').onclick = async () => {
  const data = await (await post('/export', {layout: layout()})).json();
  const name = ($('svn').value.trim().replace(/[^\w -]/g, '_').replace(/ /g, '_') || 'export') + '-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '') + '.json';
  const a = Object.assign(document.createElement('a'), {href: URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'})), download: name});
  document.body.appendChild(a); a.click(); a.remove();
  $('svm').textContent = 'downloaded ' + name;
};
$('loadb').onclick = () => $('loadf').click();
$('loadf').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  let d; try { d = JSON.parse(await f.text()); } catch (err) { toast('✗ Not a JSON file', 'err'); return; }
  const r = await (await post('/load', d)).json().catch(() => null);
  if (!r || !r.ok) { toast('✗ Load failed (restart start_scope.sh once by hand to load the new bridge)', 'err'); return; }
  const lay = d.graph_layout;
  if (lay) { for (const id in lay) if (NODES[id]) { NODES[id].x = lay[id].x; NODES[id].y = lay[id].y; place(id); } saveLayout(); }
  // Launch settings from the file go into the Launch node; Restart applies them
  if (!L) initLaunch();
  const ln = r.launch || {}, env = ln.env || {};
  if (ln.model) L.MODEL = ln.model;
  if (ln.size) L.size = [...ln.size].sort((a, b) => b - a).join(' ');
  if ('vae' in ln) L.vae = ln.vae || '';
  if (ln.seed != null) L.seed = ln.seed;
  for (const k in env) if (k in L && env[k] != null) L[k] = String(env[k]);
  if (ln.input_size) L.CAMERA_SIZE = ln.input_size;
  const lb = NODES.launch.el.querySelector('.bd'); if (lb) lb.innerHTML = NODES.launch.body();
  await poll();
  const name = d.name || f.name;
  if (r.skipped.length) toast(`⚠ Loaded ${name}, but missing image(s): ${r.skipped.join(', ')}`, 'err');
  else if (r.restart_for.length) toast(`↻ Loaded ${name}. Needs a restart for ${r.restart_for.join(', ')}: Launch node → Restart`, 'ok');
  else toast(`↻ Loaded ${name} (memory reset). Launch settings are in the Launch node; Restart if they differ`, 'ok');
  $('svm').textContent = 'loaded ' + f.name;
};
$('save').onclick = saveNow; $('svn').onkeydown = e => { if (e.key === 'Enter') saveNow(); };

// ---------- poll ----------
let built = false;
async function poll() {
  try {
    S = await (await fetch('/state')).json();
    if (!built) { buildNodes(); built = true; }
    bar();
    if (S.output_warning && !window._warned) { window._warned = true; toast('✗ ' + S.output_warning, 'err'); }
    if (!dragging) { renderBodies(); drawWires(); }
  } catch (e) {}
}
applyView();
poll(); setInterval(poll, 1000);
addEventListener('resize', drawWires);
</script>
</body>
