<!-- ai-livestream patch: memory panel (injected before </body> by patch_webui.sh; upstream file otherwise unchanged) -->
<style>
  #aiMemPanel { position: fixed; right: 12px; bottom: 12px; z-index: 9999; display: flex; gap: 8px; align-items: center;
    background: rgba(20,20,24,.85); color: #eee; font: 12px system-ui, sans-serif; padding: 6px 8px; border-radius: 8px; }
  #aiMemPanel button { background: #e8a13a; color: #111; border: 0; border-radius: 5px; padding: 3px 8px; font-weight: 600; cursor: pointer; }
  #aiMemPanel input { width: 52px; background: #2a2a30; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 2px 4px; }
</style>
<div id="aiMemPanel">
  <button id="aiMemReset" type="button" title="Reset model memory (R)">Reset (R)</button>
  <span id="aiMemAge" title="time since last reset">–</span>
  <label title="auto-reset every N frames (0 = never)">auto <input id="aiMemAuto" type="number" min="0" step="100" value="0"></label>
  <button id="aiOrient" type="button" title="Flip output aspect: landscape / portrait (O)">⇄</button>
  <button id="aiImgBtn" type="button" title="Use an image as the camera (static stream)">🖼</button>
  <button id="aiCamBtn" type="button" title="Back to the real webcam" style="display:none">📷</button>
  <input id="aiImgFile" type="file" accept="image/*" style="display:none">
</div>
<script>
(() => {
  const auto = document.getElementById("aiMemAuto"), age = document.getElementById("aiMemAge");
  const hidden = document.getElementById("kvResetFrames");
  let t0 = null;
  const sync = () => { if (hidden) hidden.value = String(Math.max(0, Math.floor(Number(auto.value) || 0))); };
  auto.addEventListener("change", sync); sync();
  const reset = () => { sync(); t0 = Date.now(); try { send(); } catch (e) { console.warn("reset failed", e); } };
  document.getElementById("aiMemReset").addEventListener("click", reset);
  document.addEventListener("keydown", (e) => {
    const tag = (e.target && e.target.tagName) || "";
    if ((e.key === "r" || e.key === "R") && !e.ctrlKey && !e.metaKey && !e.altKey && !/INPUT|TEXTAREA|SELECT/.test(tag) && !(e.target && e.target.isContentEditable)) {
      e.preventDefault(); reset();
    }
  });
  // Output orientation: upstream forces it to the camera's orientation; this lock (saved in localStorage) wins.
  const ob = document.getElementById("aiOrient");
  const origApply = window.applyOrientation;
  let lock = localStorage.getItem("aiOrientLock") || null;
  const label = () => { ob.textContent = "⇄ " + (currentOrientation() === "portrait" ? "Portrait" : "Landscape"); };
  if (typeof origApply === "function") {
    window.applyOrientation = (o) => { origApply(lock || o); label(); };
    if (lock) origApply(lock);
  }
  label();
  const flip = () => {
    lock = currentOrientation() === "portrait" ? "landscape" : "portrait";
    localStorage.setItem("aiOrientLock", lock);
    if (typeof origApply === "function") origApply(lock);
    label();
    try { if (typeof ws !== "undefined" && ws && ws.readyState === WebSocket.OPEN && sessionGranted) { t0 = Date.now(); send(); } } catch (e) { console.warn(e); }
  };
  ob.addEventListener("click", flip);
  document.addEventListener("keydown", (e) => {
    const tag = (e.target && e.target.tagName) || "";
    if ((e.key === "o" || e.key === "O") && !e.ctrlKey && !e.metaKey && !e.altKey && !/INPUT|TEXTAREA|SELECT/.test(tag) && !(e.target && e.target.isContentEditable)) {
      e.preventDefault(); flip();
    }
  });
  // Image input: getUserMedia returns a 30 fps canvas stream of the chosen image while one is set, so the normal
  // "start camera" flow works unchanged (static stream). The page sees a camera with the current orientation.
  const imgBtn = document.getElementById("aiImgBtn"), camBtn2 = document.getElementById("aiCamBtn");
  const imgFile = document.getElementById("aiImgFile");
  const md = navigator.mediaDevices, realGUM = md && md.getUserMedia ? md.getUserMedia.bind(md) : null;
  let img = null, cvs = null, drawTimer = null;
  const drawImg = () => {
    if (!img || !cvs) return;
    const portrait = currentOrientation() === "portrait";
    const W = portrait ? 720 : 1280, H = portrait ? 1280 : 720;
    if (cvs.width !== W || cvs.height !== H) { cvs.width = W; cvs.height = H; }
    const c = cvs.getContext("2d"), s2 = Math.max(W / img.width, H / img.height);   // cover-fit, centered
    const w = img.width * s2, h = img.height * s2;
    c.fillStyle = "#000"; c.fillRect(0, 0, W, H);
    c.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
  };
  if (realGUM) {
    md.getUserMedia = async (constraints) => {
      if (img && constraints && constraints.video) {
        cvs = cvs || document.createElement("canvas");
        drawImg();
        if (!drawTimer) drawTimer = setInterval(drawImg, 1000 / 30);
        return cvs.captureStream(30);
      }
      return realGUM(constraints);
    };
  }
  const restartCam = () => {   // stop the current stream so the next start picks the new source
    try { if (typeof stopActiveRun === "function") stopActiveRun(); } catch (e) {}
    try { const v = document.querySelector("video#camera") || camera; if (v && v.srcObject) { v.srcObject.getTracks().forEach(t => t.stop()); v.srcObject = null; } } catch (e) {}
    try { if (typeof stream !== "undefined" && stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } } catch (e) {}
  };
  imgBtn.addEventListener("click", () => imgFile.click());
  imgFile.addEventListener("change", () => {
    const f = imgFile.files && imgFile.files[0]; if (!f) return;
    const im = new Image();
    im.onload = () => { img = im; restartCam(); imgBtn.textContent = "🖼 " + f.name.slice(0, 14); camBtn2.style.display = ""; };
    im.src = URL.createObjectURL(f);
  });
  camBtn2.addEventListener("click", () => {
    img = null; if (drawTimer) { clearInterval(drawTimer); drawTimer = null; }
    restartCam(); imgBtn.textContent = "🖼"; camBtn2.style.display = "none";
  });
  // count from the first start and from server-side auto resets too
  const camBtn = document.getElementById("startCameraBtn"); if (camBtn) camBtn.addEventListener("click", () => { t0 = Date.now(); });
  const sb = document.getElementById("sendBtn"); if (sb) sb.addEventListener("click", () => { t0 = Date.now(); });
  setInterval(() => {
    if (!t0) return;
    const s = Math.floor((Date.now() - t0) / 1000);
    age.textContent = (s >= 60 ? Math.floor(s / 60) + "m " : "") + (s % 60) + "s";
  }, 1000);
})();
</script>
